<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | BOOKSWAP</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <a class="brand auth-brand" href="index.html"
        ><span class="brand-mark">B</span
        ><span>BOOK<span class="brand-accent">SWAP</span></span></a
      >
      <section class="auth-panel register-panel">
        <p class="eyebrow">Join the community</p>
        <h1>Your next read<br />starts <em>here.</em></h1>
        <form id="register-form" class="form-stack">
          <div class="form-grid">
            <label
              >Student name<input
                name="name"
                placeholder="Full name"
                required /></label
            ><label
              >Email<input
                type="email"
                name="email"
                placeholder="you@college.edu"
                required /></label
            ><label
              >Password<input
                type="password"
                name="password"
                minlength="6"
                placeholder="At least 6 characters"
                required /></label
            ><label
              >Confirm password<input
                type="password"
                name="confirmPassword"
                placeholder="Repeat password"
                required
            /></label>
          </div>
          <label
            >College<input
              name="college"
              placeholder="Your college or university"
              required /></label
          ><button class="button full-width" type="submit">
            Create account <span>→</span>
          </button>
          <p class="form-message" aria-live="polite"></p>
        </form>
        <p class="auth-switch">
          Already a member? <a href="login.html">Log in</a>
        </p>
      </section>
      <aside class="auth-aside register-aside">
        <p class="eyebrow">Make your shelf matter</p>
        <div class="quote-stat">
          <strong>01</strong><span>List books you no longer need.</span>
        </div>
        <div class="quote-stat">
          <strong>02</strong><span>Find what your next semester needs.</span>
        </div>
        <div class="quote-stat">
          <strong>03</strong><span>Keep knowledge moving.</span>
        </div>
      </aside>
    </main>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
