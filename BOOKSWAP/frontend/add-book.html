<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List a book | BOOKSWAP</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="app-page">
    <header class="app-header">
      <a class="brand" href="dashboard.html"
        ><span class="brand-mark">B</span
        ><span>BOOK<span class="brand-accent">SWAP</span></span></a
      >
      <nav class="main-nav">
        <a href="dashboard.html">Home</a><a href="explore.html">Explore</a
        ><a class="active" href="add-book.html">List a book</a>
      </nav>
      <div class="header-actions">
        <a class="avatar" href="dashboard.html#profile">AS</a>
      </div>
    </header>
    <main class="form-page section-wrap">
      <div class="request-heading-large">
        <p class="eyebrow">Give it a second life</p>
        <h1>List a <em>book.</em></h1>
        <p class="muted">
          Add a book to your shelf and help another student discover it.
        </p>
      </div>
      <form id="add-book-form" class="wide-form form-stack">
        <div class="form-grid">
          <label
            >Book title<input
              name="title"
              placeholder="e.g. Atomic Habits"
              required /></label
          ><label
            >Author<input
              name="author"
              placeholder="e.g. James Clear"
              required /></label
          ><label
            >Category<select name="category">
              <option>Academic</option>
              <option>Fiction</option>
              <option>Skills</option>
              <option>Other</option>
            </select></label
          ><label
            >Type<select name="type">
              <option>Exchange</option>
              <option>Borrow</option>
              <option>Give Away</option>
            </select></label
          ><label
            >Condition<select name="condition">
              <option>New</option>
              <option>Good</option>
              <option>Used</option>
            </select></label
          ><label
            >City<input
              name="city"
              placeholder="Where is the book located?"
              required
          /></label>
        </div>
        <label
          >About this book<textarea
            name="description"
            rows="4"
            placeholder="Add a short note for interested readers..."
          ></textarea></label
        ><button class="button" type="submit">
          Add to my shelf <span>→</span>
        </button>
        <p class="form-message" aria-live="polite"></p>
      </form>
    </main>
    <script src="../js/main.js"></script>
    <script src="../js/books.js"></script>
  </body>
</html>
